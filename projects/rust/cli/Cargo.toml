[package]
name = "udex-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
udex-sdk = { path = "../sdk" }
udex-api = { path = "../api" }
udex-datastore = { path = "../datastore" }
udex-server = { path = "../server" }
tokio = { workspace = true }
tonic = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tabled = "0.19"
toml = { workspace = true }
jsonwebtoken = { workspace = true }
time = { workspace = true }
rustls = { workspace = true }
oauth2 = { version = "5", features = ["reqwest"] }
secrets-rs = { workspace = true }
secrets-rs-macros = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-shared-rt = { workspace = true }
maybe-once = { workspace = true }
rstest = { workspace = true }
dotenvy = { workspace = true }
serde_json = { workspace = true }
udex-datastore = { path = "../datastore", features = ["integration_test"] }
ory-hydra-client = { version = "26.2", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[bin]]
name = "udex"
path = "src/main.rs"
