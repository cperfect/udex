[package]
name = "udex-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust client SDK for Udex — connection, TLS, OAuth2, and service wrappers"

[dependencies]
udex-api = { path = "../api" }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

[[example]]
name = "create_entry"
path = "examples/create_entry.rs"

[[example]]
name = "get_entry"
path = "examples/get_entry.rs"

[[example]]
name = "bulk_write"
path = "examples/bulk_write.rs"

[[example]]
name = "envelope_write"
path = "examples/envelope_write.rs"

[dev-dependencies]
udex-test-utils = { path = "../test-utils" }
udex-server = { path = "../server" }
udex-datastore = { path = "../datastore", features = ["integration_test"] }
tokio-shared-rt = { workspace = true }
maybe-once = { workspace = true }
rstest = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
time = { workspace = true }
rustls = { workspace = true }
secrets-rs = { workspace = true }
ory-hydra-client = { version = "26.2", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
tempfile = { workspace = true }
