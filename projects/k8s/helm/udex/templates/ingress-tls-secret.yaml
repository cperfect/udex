# Secret (kubernetes.io/tls) — the edge certificate Traefik presents to clients
# when it terminates TLS at the ingress (referenced by IngressRoute.tls.secretName).
#
# This is distinct from the Opaque Secret in secret.yaml, which holds the pod's
# OWN cert/key (used on the re-encrypted backend hop) plus DATABASE_URL. Here we
# use the built-in kubernetes.io/tls type, which Traefik recognises directly and
# which requires exactly the tls.crt and tls.key keys.
#
# Values are supplied at deploy time via --set-file (see scripts/deploy.sh) from
# the generated edge certs (projects/k8s/traefik/certs) and never committed.
# b64enc encodes the raw PEM, as Kubernetes stores Secret values as base64.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udex.fullname" . }}-tls
  labels:
    {{- include "udex.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  # required fails helm upgrade/install immediately if the value is empty,
  # producing an actionable error rather than an ingress with no usable cert.
  tls.crt: {{ required "secrets.traefikTlsCrt is required (pass via --set-file secrets.traefikTlsCrt=<path/to/tls.crt>)" .Values.secrets.traefikTlsCrt | b64enc }}
  tls.key: {{ required "secrets.traefikTlsKey is required (pass via --set-file secrets.traefikTlsKey=<path/to/tls.key>)" .Values.secrets.traefikTlsKey | b64enc }}
