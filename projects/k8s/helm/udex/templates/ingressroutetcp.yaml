# IngressRouteTCP — a Traefik-specific Custom Resource (CRD) that configures
# TCP routing at the ingress layer. Standard Kubernetes Ingress only handles
# HTTP/HTTPS at L7; IngressRouteTCP works at L4 (raw TCP), which is required
# for gRPC with TLS.
#
# tls.passthrough: true means Traefik forwards the raw TLS bytes directly to
# the pod without terminating (decrypting) TLS itself. The server handles TLS
# termination internally using the cert mounted from the Secret. This is
# necessary because gRPC clients verify the server certificate, and that
# certificate must be the one served by the application, not by Traefik.
#
# HostSNI(`*`): matches any SNI hostname, routing all TCP traffic on the
# websecure entrypoint to this service. In a multi-tenant cluster you would
# replace `*` with the specific hostname (e.g. HostSNI(`udex.example.com`)).
#
# k3d installs Traefik by default, so this CRD is available without any
# extra configuration in local dev.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "udex.fullname" . }}
  labels:
    {{- include "udex.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure  # Traefik's built-in TLS entrypoint (port 443)
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "udex.fullname" . }}
          port: 443
  tls:
    passthrough: true
