# Secret — stores sensitive values that the pod needs at runtime.
# Kubernetes Secrets are base64-encoded (not encrypted by default), so they
# should be supplied at deploy time via --set-string and never committed to
# source control. See values.yaml for the expected format of each value.
#
# type: Opaque means an arbitrary key/value bag (no special k8s handling).
# Other types (e.g. kubernetes.io/tls) have built-in validation; we use
# Opaque because we manage the TLS cert/key ourselves.
#
# b64enc: Helm encodes the raw PEM/URL string to base64 before writing it
# into the Secret — Kubernetes stores Secret values as base64.
#
# The checksum annotation on the Deployment pod template (deployment.yaml)
# ensures pods are restarted whenever this Secret changes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udex.fullname" . }}
  labels:
    {{- include "udex.labels" . | nindent 4 }}
type: Opaque
data:
  # required fails helm upgrade/install immediately if the value is empty,
  # producing an actionable error rather than a pod that crashes at runtime.
  DATABASE_URL: {{ required "secrets.databaseUrl is required (pass via --set-file secrets.databaseUrl=<file>)" .Values.secrets.databaseUrl | b64enc }}
  tls.crt: {{ required "secrets.tlsCrt is required (pass via --set-file secrets.tlsCrt=<path/to/tls.crt>)" .Values.secrets.tlsCrt | b64enc }}
  tls.key: {{ required "secrets.tlsKey is required (pass via --set-file secrets.tlsKey=<path/to/tls.key>)" .Values.secrets.tlsKey | b64enc }}
{{- if .Values.observability.enabled }}
  # OTLP CA — verifies the observability Collector's TLS cert. Not secret, but
  # mounted via the Secret volume to reuse the existing TLS mount pattern.
  otlp-ca.crt: {{ required "secrets.otlpCa is required when observability.enabled (pass via --set-file secrets.otlpCa=<path/to/ca.crt>)" .Values.secrets.otlpCa | b64enc }}
{{- end }}
