# ConfigMap — stores the server's config.yaml as a plain-text file in the cluster.
# The Deployment mounts this as /etc/udex/config.yaml inside the container.
# ConfigMaps are not encrypted; do not put secrets here — see secret.yaml.
#
# The |- block scalar renders multi-line text without a trailing newline.
# Values are interpolated from values.yaml using Go template expressions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "udex.fullname" . }}
  labels:
    {{- include "udex.labels" . | nindent 4 }}
data:
  config.yaml: |-
    server:
      bind_address: {{ .Values.server.bindAddress | quote }}
      request_timeout_secs: {{ .Values.server.requestTimeoutSecs }}
      max_connections: {{ .Values.server.maxConnections }}
      max_message_size_bytes: {{ .Values.server.maxMessageSizeBytes | int }}
      tls:
        # These are URN references (secrets-rs indirection), NOT secrets.
        # The server resolves them at runtime: "urn:secrets-rs:file:<path>" reads a
        # file and "urn:secrets-rs:env:<VAR>" reads an env var. The actual key
        # material lives in the Secret (see secret.yaml) and is never stored here.
        cert: "urn:secrets-rs:file:/etc/udex/tls/tls.crt"
        key: "urn:secrets-rs:file:/etc/udex/tls/tls.key"
      authz:
        jwks_url: {{ .Values.authz.jwksUrl | quote }}
        jwt_issuer: {{ .Values.authz.jwtIssuer | quote }}
        jwt_audience: {{ .Values.authz.jwtAudience | quote }}
        danger_allow_non_tls: {{ .Values.authz.dangerAllowNonTls }}
        scope_claim_name: {{ .Values.authz.scopeClaimName | quote }}
        mask_subject_in_logs: {{ .Values.authz.maskSubjectInLogs }}
{{- if .Values.observability.enabled }}
      # OpenTelemetry export to the compose collector (plaintext OTLP/gRPC on
      # :4317 — the local dev/CI fixture terminates no TLS, so no otlp_ca). JSON
      # stdout logging stays on regardless.
      observability:
        enabled: true
        otlp_endpoint: {{ .Values.observability.otlpEndpoint | quote }}
        # The local dev/CI collector terminates no TLS; opt into plaintext OTLP.
        dangerous_allow_non_tls: {{ .Values.observability.dangerousAllowNonTls }}
        sample_ratio: {{ .Values.observability.sampleRatio }}
        resource_attributes:
          deployment.environment: {{ .Values.observability.deploymentEnvironment | quote }}
{{- end }}
    datastore:
      # URN reference (see the server.tls note above) — not a secret. The actual
      # DATABASE_URL value is injected from the Secret as an env var by the Deployment.
      connection_url: "urn:secrets-rs:env:DATABASE_URL"
      max_connections: {{ .Values.datastore.maxConnections }}
      min_connections: {{ .Values.datastore.minConnections }}
      connection_timeout_secs: {{ .Values.datastore.connectionTimeoutSecs }}
      query_timeout_secs: {{ .Values.datastore.queryTimeoutSecs }}
      dangerous_allow_non_tls: {{ .Values.datastore.dangerousAllowNonTls }}
      apply_migrations: {{ .Values.datastore.applyMigrations }}
