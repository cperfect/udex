image:
  repository: udex
  tag: latest
  # Never pull — image is loaded into k3d with image-load.sh
  pullPolicy: Never

# Number of server pods. Defaults to 2 so the dev cluster always exercises the
# multi-instance (stateless) invariant — the server keeps no per-instance state
# that another instance can't see (all state lives in the datastore). The k8s
# integration tests address individual instances directly to verify this.
replicaCount: 2

server:
  bindAddress: "0.0.0.0:443"
  requestTimeoutSecs: 30
  maxConnections: 1000
  maxMessageSizeBytes: 4194304

authz:
  # Hydra JWKS endpoint reachable from inside k3d pods via host.k3d.internal.
  # dangerous_allow_non_tls is required because the local Compose Hydra has no TLS.
  jwksUrl: "http://host.k3d.internal:4444/.well-known/jwks.json"
  # Must match URLS_SELF_ISSUER in the Compose Hydra config.
  jwtIssuer: "http://localhost:4444/"
  jwtAudience: "udex"
  dangerousAllowNonTls: true
  # Hydra uses "scp" (array) instead of the RFC 8693 "scope" claim.
  scopeClaimName: "scp"
  maskSubjectInLogs: false

datastore:
  maxConnections: 10
  minConnections: 1
  connectionTimeoutSecs: 10
  queryTimeoutSecs: 30
  # Compose PostgreSQL has no TLS.
  dangerousAllowNonTls: true
  # Apply pending migrations on startup — acceptable for local dev.
  applyMigrations: true

# OpenTelemetry observability. The dev cluster exports OTLP to the collector in
# the base compose stack (projects/compose), running on the host and reached from
# k3d pods via host.k3d.internal — the same bridge used for postgres and Hydra.
# The collector forwards to OpenObserve; nothing here names the backend, which is
# the point. Full sampling for dev. The collector is always-on with the base
# stack (`docker compose -f projects/compose/docker-compose.yml up -d`).
observability:
  enabled: true
  # Compose OTel Collector, reachable from k3d pods via the host. OTLP over gRPC
  # (port 4317); `http://` = plaintext — the local dev/CI fixture terminates no
  # TLS (see ST0027).
  otlpEndpoint: "http://host.k3d.internal:4317"
  # The collector terminates no TLS, so plaintext OTLP must be opted into
  # (mirrors authz.dangerousAllowNonTls / datastore.dangerousAllowNonTls). Dev only.
  dangerousAllowNonTls: true
  # Full trace + metric sampling in dev.
  sampleRatio: 1.0
  # Tags cluster-originated telemetry so it is distinguishable (deployment.environment).
  deploymentEnvironment: "k3d"

# Secrets — never store real values here.
# Provide at deploy time via --set-string or scripts/deploy.sh.
secrets:
  # PostgreSQL connection URL, e.g. postgres://postgres:secret@host.k3d.internal:5432/postgres
  databaseUrl: ""
  # Pod TLS — the server's OWN cert/key, used on the re-encrypted backend hop
  # (Traefik -> pod). PEM-encoded (raw PEM, not base64).
  tlsCrt: ""
  tlsKey: ""
  # Edge TLS — the certificate Traefik presents to clients when it terminates
  # TLS at the ingress (projects/k8s/traefik/certs). PEM-encoded (raw PEM).
  traefikTlsCrt: ""
  traefikTlsKey: ""
