# Udex local observability stack (ST0026 / WP01).
#
# Opt-in: this stack is NOT started by a plain `docker compose up` of the base
# stack. Bring it up with projects/observability/scripts/up.sh, which runs this
# file as its OWN compose project (-p udex-observability) and attaches it to the
# already-running base/devcontainer network via the external `default` network
# (OBS_NETWORK, detected by the script). Running it as a single-file project
# means relative bind-mount paths resolve against this directory - avoiding the
# multi-file `-f a -f b` relative-path footgun.
#
# Reachability:
#   - In the devcontainer, the app reaches services by name: otel-collector:4317.
#   - On the host, services are also published (localhost:3000/9090/3100/3200/...).
#
# Bind mounts use ${OBS_HOST_DIR} (set by up.sh) because the Docker daemon is the
# HOST's daemon. Inside the devcontainer (docker-outside-of-docker) the daemon
# does not know our /workspace path, so up.sh translates it to the host path.
# Default `.` is correct only when run directly on the host.
#
# DO NOT use these settings in production - local development only.

name: udex-observability

networks:
  # Attach to the running base/devcontainer stack's network so the collector can
  # reach `postgres` and the app can reach `otel-collector`. The script sets
  # OBS_NETWORK from the running postgres container; there is no safe default.
  default:
    name: ${OBS_NETWORK:?set OBS_NETWORK to the running stack network (use scripts/up.sh)}
    external: true

services:

  # OpenTelemetry Collector (contrib) - single OTLP ingest for the app's traces,
  # metrics, and logs, plus PostgreSQL server metrics via postgresqlreceiver.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      # postgresqlreceiver auth - sourced from the workspace .env (--env-file).
      - POSTGRES_PASSWORD_SECRET=${POSTGRES_PASSWORD_SECRET}
    volumes:
      - ${OBS_HOST_DIR:-.}/collector/config.yaml:/etc/otel/config.yaml:ro
      - ${OBS_HOST_DIR:-.}/certs:/etc/otel/certs:ro
    ports:
      - "4317:4317"   # OTLP gRPC (TLS)
      - "4318:4318"   # OTLP HTTP (TLS)
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
      - "13133:13133" # health_check extension
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped

  # Distributed tracing backend.
  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ${OBS_HOST_DIR:-.}/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API
    restart: unless-stopped

  # Metrics store; scrapes the collector's Prometheus exporter.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ${OBS_HOST_DIR:-.}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"   # Prometheus UI + query API
    restart: unless-stopped

  # Log aggregation backend (OTLP ingest + Vector sink target).
  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ${OBS_HOST_DIR:-.}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"   # Loki push/query + OTLP (/otlp/v1/logs)
    restart: unless-stopped

  # Container-log shipper: tails Docker container stdout (udex app, postgres,
  # hydra) and forwards to Loki - the durable "floor" for the hybrid log design.
  vector:
    image: timberio/vector:0.44.0-debian
    profiles: ["observability"]
    volumes:
      - ${OBS_HOST_DIR:-.}/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read container logs via the Docker API (docker-outside-of-docker safe).
      # docker.sock is an absolute daemon-host path, so it needs no translation.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - loki
    restart: unless-stopped

  # Visualisation; datasources + dashboards provisioned from disk.
  grafana:
    image: grafana/grafana:11.5.0
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ${OBS_HOST_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBS_HOST_DIR:-.}/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
