# Grafana Loki - single-binary local dev config. Filesystem storage, in-memory
# ring, OTLP ingestion enabled (structured metadata required for OTLP logs).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP log ingestion (resource/scope attributes -> structured
  # metadata) and for the Loki log-volume queries Grafana uses.
  allow_structured_metadata: true
  volume_enabled: true
