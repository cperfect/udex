# Vector - ships container stdout to Loki (the durable "floor" of the hybrid log
# design, alongside the app's own OTLP logs). It collects all containers, then
# drops the noise (the observability stack's own containers - including Vector -
# and the k3d node containers) in the `udex_only` transform below.
#
# Why a filter transform rather than the source's include_labels allowlist:
# Vector 0.44's docker_logs include_labels did not match the Compose service
# labels reliably (it collected nothing), so the scoping is done here in VRL.

data_dir: /vector-data-dir

sources:
  docker:
    type: docker_logs

transforms:
  # The udex server emits JSON logs; lift those fields to the top level so they
  # are queryable in Loki. Non-JSON lines (postgres, hydra) pass through as-is.
  parse:
    type: remap
    inputs: [docker]
    source: |
      structured, err = parse_json(.message)
      if err == null {
        . = merge(., object!(structured))
      }

  # Drop the observability stack's own containers (avoid feedback noise; their
  # names start with the compose project "udex-observability", which also covers
  # Vector itself) and the k3d node containers. Keeps the Udex base stack
  # (postgres, hydra) and the app.
  udex_only:
    type: filter
    inputs: [parse]
    condition: '!starts_with(string(.container_name) ?? "", "udex-observability") && !starts_with(string(.container_name) ?? "", "k3d-")'

sinks:
  loki:
    type: loki
    inputs: [udex_only]
    endpoint: http://loki:3100
    encoding:
      codec: json
    out_of_order_action: accept
    labels:
      container: "{{ container_name }}"
      source: vector
