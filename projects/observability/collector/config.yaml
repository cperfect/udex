# OpenTelemetry Collector (contrib) config for local Udex development.
#
# Single OTLP ingest for the app's traces/metrics/logs (over TLS), plus
# PostgreSQL server metrics via the postgresqlreceiver. Exports:
#   traces  -> Tempo (OTLP)
#   metrics -> Prometheus (scrape exporter on :8889)
#   logs    -> Loki (OTLP HTTP)

receivers:
  # App-facing OTLP endpoints, TLS-terminated with the generated collector cert
  # (projects/observability/certs). The app trusts ca.crt via its `otlp_ca`.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otel/certs/collector.crt
          key_file: /etc/otel/certs/collector.key
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otel/certs/collector.crt
          key_file: /etc/otel/certs/collector.key

  # PostgreSQL server metrics. The local dev Postgres has no TLS, so tls.insecure
  # is set; password comes from the workspace .env via the container environment.
  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: postgres
    password: ${env:POSTGRES_PASSWORD_SECRET}
    databases:
      - postgres
    collection_interval: 10s
    tls:
      insecure: true

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, postgresql]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
