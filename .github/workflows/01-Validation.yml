name: 01-Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: every job here only reads the repo (checkout; setup-protoc
# uses GITHUB_TOKEN read-only for API rate limits). None write contents, comment
# on PRs, or upload security events, so a single read-only default suffices.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/rust

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Each step delegates to a script in scripts/ so developers can run the
      # exact same command locally and get the same outcome as CI.
      - name: Check formatting
        working-directory: .
        run: bash scripts/validate-lint-fmt.sh

      - name: Clippy
        working-directory: .
        run: bash scripts/validate-lint-clippy.sh

      - name: Benchmarks compile check
        working-directory: .
        run: bash scripts/validate-lint-bench.sh

  k8s-lint:
    name: k8s Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm v4.0.0
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
          chmod 700 get_helm.sh
          ./get_helm.sh -v v4.0.0
          rm get_helm.sh

      # Each step delegates to a script in scripts/ so developers can run the
      # exact same command locally and get the same outcome as CI.
      - name: Helm lint
        run: bash scripts/validate-lint-helm.sh

      # TODO: Add Dockerfile linting with hadolint once it is added to the
      # devcontainer. https://github.com/hadolint/hadolint

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rust

    env:
      # Postgres — password comes from a CI secret; URL uses localhost because
      # docker compose publishes ports to the runner host.
      DATABASE_URL: postgres://postgres:${{ secrets.VALIDATE_POSTGRES_PASSWORD_SECRET }}@localhost:5432/postgres
      # Hydra — HYDRA_DB_PASSWORD_SECRET and HYDRA_SECRETS_SYSTEM_SECRET are
      # dev-only fixed values (CI test infra, not production secrets). They only
      # need to match between the compose services; they are never exposed to the
      # public internet and carry no real secret material.
      HYDRA_PUBLIC_URL: http://localhost:4444
      HYDRA_ADMIN_URL: http://localhost:4445
      HYDRA_ISSUER: http://localhost:4444/
      RUST_LOG: info
      # Observability fixture (OpenObserve-backed; ST0028) is part of the base
      # compose stack, so the obs tests run here too. The test process is on the
      # runner host, so it reaches the fixture via the published ports.
      OPENOBSERVE_URL: http://localhost:5080
      OTEL_COLLECTOR_OTLP_ENDPOINT: http://localhost:4317

    steps:
      - uses: actions/checkout@v4

      # OpenObserve requires credentials on both ingest and query. They are
      # generated per job rather than stored as repository secrets: the fixture
      # is ephemeral, loopback-only, and destroyed with the runner, so a
      # long-lived secret would add rotation burden without adding protection.
      # Kept in step with scripts/gen-env.sh — OpenObserve rejects a password
      # without lower, upper, digit and a special character, and panics on boot
      # when it is not met.
      - name: Generate OpenObserve fixture credentials
        run: |
          EMAIL="root@udex.local"
          PASSWORD="Ux1-$(openssl rand -hex 24)"
          BASIC_AUTH=$(printf '%s' "${EMAIL}:${PASSWORD}" | base64 -w0)
          echo "::add-mask::${PASSWORD}"
          echo "::add-mask::${BASIC_AUTH}"
          {
            echo "OPENOBSERVE_ROOT_EMAIL=${EMAIL}"
            echo "OPENOBSERVE_ROOT_PASSWORD_SECRET=${PASSWORD}"
            echo "OPENOBSERVE_BASIC_AUTH_SECRET=${BASIC_AUTH}"
          } >> "${GITHUB_ENV}"

      - name: Start services (postgres + hydra + observability)
        working-directory: projects/compose
        env:
          POSTGRES_PASSWORD_SECRET: ${{ secrets.VALIDATE_POSTGRES_PASSWORD_SECRET }}
          HYDRA_DB_PASSWORD_SECRET: ${{ secrets.VALIDATE_HYDRA_DB_PASSWORD_SECRET }}
          HYDRA_SECRETS_SYSTEM_SECRET: ${{ secrets.VALIDATE_HYDRA_SECRETS_SYSTEM_SECRET }}
        run: |
          # Start the test-relevant services. OpenObserve + collector + Vector are
          # the whole observability fixture — ST0028 folded the reader UI into
          # OpenObserve, so there is no longer a separate UI stack to omit here.
          docker compose up -d postgres hydra openobserve otel-collector vector
          echo "Waiting for Hydra admin API..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:4445/health/ready && { echo "Hydra ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:4445/health/ready || { echo "Hydra did not become ready."; exit 1; }
          echo "Waiting for OpenObserve..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5080/healthz && { echo "OpenObserve ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:5080/healthz || { echo "OpenObserve did not become ready."; exit 1; }
          echo "Waiting for the OTel collector..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:13133/ && { echo "Collector ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:13133/ || { echo "OTel collector did not become ready."; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/rust
          # shared-key ensures test and k8s-test share the same cache slot.
          # Without it all three jobs (lint, test, k8s-test) compete for the
          # same key, and whichever saves first (usually lint) wins — leaving
          # k8s-test with a partial cache that lacks the compiled test binaries.
          shared-key: udex-build

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate key material
        working-directory: .
        run: bash scripts/gen-keys-and-certs.sh

      # Delegates to a script so developers can run the same command locally
      # (devcontainer provides services and env vars; CI sets them above).
      - name: Build & Test
        working-directory: .
        run: bash scripts/validate-test-rust.sh

      # Catches tests that only pass because another test ran first. Kept as its
      # own step so a failure reads as an ordering problem rather than a test
      # failure. Cheap (~20s) because it drives the already-compiled binary
      # directly rather than going through cargo per test. K8S_SERVER_URL is
      # unset in this job, so the k8s-gated tests take their skip path — they are
      # gated on a cluster, not on other tests.
      - name: Test isolation
        working-directory: .
        run: bash scripts/validate-test-isolation.sh

  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            k8s:
              - 'projects/k8s/**'
              - 'projects/rust/cli/Dockerfile'
              - 'projects/rust/cli/src/**'
              - 'projects/rust/sdk/tests/**'

  k8s-test:
    name: k8s Integration Test
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.k8s == 'true'

    env:
      DATABASE_URL: postgres://postgres:${{ secrets.VALIDATE_POSTGRES_PASSWORD_SECRET }}@localhost:5432/postgres
      HYDRA_PUBLIC_URL: http://localhost:4444
      HYDRA_ADMIN_URL: http://localhost:4445
      HYDRA_ISSUER: http://localhost:4444/
      K8S_SERVER_URL: https://localhost:8443
      RUST_LOG: info
      # The k8s deployment exports OTLP to host.k3d.internal:4317 -> the compose
      # collector; the obs k8s tests query OpenObserve on the runner host.
      OPENOBSERVE_URL: http://localhost:5080

    steps:
      - uses: actions/checkout@v4

      # OpenObserve requires credentials on both ingest and query. They are
      # generated per job rather than stored as repository secrets: the fixture
      # is ephemeral, loopback-only, and destroyed with the runner, so a
      # long-lived secret would add rotation burden without adding protection.
      # Kept in step with scripts/gen-env.sh — OpenObserve rejects a password
      # without lower, upper, digit and a special character, and panics on boot
      # when it is not met.
      - name: Generate OpenObserve fixture credentials
        run: |
          EMAIL="root@udex.local"
          PASSWORD="Ux1-$(openssl rand -hex 24)"
          BASIC_AUTH=$(printf '%s' "${EMAIL}:${PASSWORD}" | base64 -w0)
          echo "::add-mask::${PASSWORD}"
          echo "::add-mask::${BASIC_AUTH}"
          {
            echo "OPENOBSERVE_ROOT_EMAIL=${EMAIL}"
            echo "OPENOBSERVE_ROOT_PASSWORD_SECRET=${PASSWORD}"
            echo "OPENOBSERVE_BASIC_AUTH_SECRET=${BASIC_AUTH}"
          } >> "${GITHUB_ENV}"

      - name: Start services (postgres + hydra + observability)
        working-directory: projects/compose
        env:
          POSTGRES_PASSWORD_SECRET: ${{ secrets.VALIDATE_POSTGRES_PASSWORD_SECRET }}
          HYDRA_DB_PASSWORD_SECRET: ${{ secrets.VALIDATE_HYDRA_DB_PASSWORD_SECRET }}
          HYDRA_SECRETS_SYSTEM_SECRET: ${{ secrets.VALIDATE_HYDRA_SECRETS_SYSTEM_SECRET }}
        run: |
          # OpenObserve + collector + Vector receive the k3d deployment's telemetry.
          docker compose up -d postgres hydra openobserve otel-collector vector
          echo "Waiting for Hydra admin API..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:4445/health/ready && { echo "Hydra ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:4445/health/ready || { echo "Hydra did not become ready."; exit 1; }
          echo "Waiting for OpenObserve..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5080/healthz && { echo "OpenObserve ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:5080/healthz || { echo "OpenObserve did not become ready."; exit 1; }
          echo "Waiting for the OTel collector..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:13133/ && { echo "Collector ready."; break; }
            echo "  attempt $i/30…"; sleep 3
          done
          curl -sf http://localhost:13133/ || { echo "OTel collector did not become ready."; exit 1; }

      - name: Install k3d v5.8.3
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Install kubectl v1.36.1
        run: |
          curl -LO "https://dl.k8s.io/v1.36.1/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install helm v4.0.0
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
          chmod 700 get_helm.sh
          ./get_helm.sh -v v4.0.0
          rm get_helm.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/rust
          shared-key: udex-build

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate key material
        run: bash scripts/gen-keys-and-certs.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: projects
          file: projects/rust/cli/Dockerfile
          tags: udex:latest
          # load: true makes the image available in the local Docker daemon
          # so the subsequent k3d image import step can find it.
          load: true
          cache-from: type=gha,scope=udex-build
          cache-to: type=gha,mode=max,scope=udex-build

      - name: Create k3d cluster
        run: bash projects/k8s/scripts/cluster-create.sh

      - name: Load image into cluster
        run: bash projects/k8s/scripts/image-load.sh

      - name: Write .env for deploy.sh
        env:
          POSTGRES_PASSWORD_SECRET: ${{ secrets.VALIDATE_POSTGRES_PASSWORD_SECRET }}
        run: echo "POSTGRES_PASSWORD_SECRET=${POSTGRES_PASSWORD_SECRET}" > .env

      - name: Deploy to k3d
        run: bash projects/k8s/scripts/deploy.sh

      - name: Run k8s integration tests
        working-directory: .
        run: bash scripts/validate-k8s-test.sh

      - name: Teardown
        if: always()
        run: |
          bash projects/k8s/scripts/undeploy.sh || true
          bash projects/k8s/scripts/cluster-delete.sh || true
