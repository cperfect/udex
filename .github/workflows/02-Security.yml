name: 02-Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual runs from the GitHub Actions UI

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # No job here runs an authenticated git command, so the checkout token
          # does not need to persist into the local git config where later steps
          # (or anything they invoke) could read it.
          persist-credentials: false

      - name: Run Trivy (table — log output and build gate)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          exit-code: '1'
          severity: 'MEDIUM,HIGH,CRITICAL'
          format: table

      # The filesystem scan above reads source and dependency manifests; it says
      # nothing about what ends up inside the built image — the base layer and its
      # OS packages. Those drift on their own schedule, which is why this job also
      # runs on a cron: an image can acquire a fixable CVE with no change here.
      #
      # Only udex:latest is gated. The compose fixtures are third-party, dev-only
      # and never deployed; scan them on demand with
      # `bash scripts/validate-security-image.sh --fixtures`.
      - name: Build udex image
        run: bash projects/k8s/scripts/image-build.sh

      # Delegates to a script so developers can run the exact same scan locally.
      - name: Scan udex image
        run: bash scripts/validate-security-image.sh

      # Disabled until code scanning enabled as this is required to be able to upload SARIF results to the Security tab.
