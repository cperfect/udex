name: 02-Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual runs from the GitHub Actions UI

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (table — log output and build gate)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          exit-code: '1'
          severity: 'MEDIUM,HIGH,CRITICAL'
          format: table

      # Disabled until code scanning enabled as this is required to be able to upload SARIF results to the Security tab.
