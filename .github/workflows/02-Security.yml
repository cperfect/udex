name: 02-Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
