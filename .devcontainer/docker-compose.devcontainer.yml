version: "3.9"
services:
  # after https://github.com/microsoft/vscode-dev-containers/blob/main/container-templates/docker-compose/.devcontainer/docker-compose.yml
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      # [Optional] You can use build args to set options. e.g. 'VARIANT' below affects the image in the Dockerfile
      # args: 
      #   VARIANT: bullseye
    volumes:
      # This is where VS Code should expect to find your project's source code and the value of "workspaceFolder" in .devcontainer/devcontainer.json
      - ..:/workspace:cached
      # Secrets are not stored here; they are loaded from the gitignored .env at
      # the workspace root (generated by scripts/gen-env.sh). required: false so
      # that running `docker compose up` before gen-env.sh produces per-service
      # errors rather than a blanket compose startup failure with no pointer to
      # the missing file.

      # mount the user's claude dir so we can keep it between rebuilts (this is gitignored)
      - ./home/.claude:/home/vscode/.claude
    env_file:
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD_SECRET}@localhost:5432/postgres
      # Inside the devcontainer the Hydra service is reachable by its compose
      # service name, not localhost. Override the .env defaults (which use
      # localhost for host-machine access) so tests find the right endpoint.
      # HYDRA_ISSUER stays as localhost because that is the issuer Hydra embeds
      # in tokens (URLS_SELF_ISSUER=http://localhost:4444/ in docker-compose.yml).
      - HYDRA_PUBLIC_URL=http://hydra:4444
      - HYDRA_ADMIN_URL=http://hydra:4445

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"

    # Runs app on the same network as the service container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:postgres
    
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    # Uncomment the next line to use a non-root user for all processes - See https://aka.ms/vscode-remote/containers/non-root for details.
    user: vscode
